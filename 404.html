<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Tommy Li</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;600&display=swap"></noscript>
    <style>
        * { box-sizing: border-box; }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px 20px;
            background: #F5F7FA;
            color: #1B2A41;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 520px;
            padding: 2.5rem 2rem;
            border: 1px solid #E3E8EF;
            border-top: 4px solid #1F7A8C;
            border-radius: 0 0 10px 10px;
            background: #FFFFFF;
        }

        .code {
            margin: 0;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #1F7A8C;
        }

        h1 {
            margin: 0.5rem 0 0;
            font-family: "Source Serif 4", Georgia, serif;
            font-size: clamp(1.9rem, 6vw, 2.4rem);
            font-weight: 600;
            line-height: 1.2;
            color: #14243D;
        }

        p.lede { margin: 0.8rem 0 1.75rem; color: #4A5A70; }

        a.home {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            background: #14243D;
            color: #FFFFFF;
            font-weight: 600;
            text-decoration: none;
        }

        a.home:hover { background: #233A5E; }
        a.home:focus-visible { outline: 2px solid #1F7A8C; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code">Error 404</p>
        <h1>This page couldn't be found</h1>
        <p class="lede">The link may be mistyped, or the page may have moved. You can find everything from the home page.</p>
        <a class="home" href="/">Back to Tommy's page</a>
    </main>
</body>
</html>
